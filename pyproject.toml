[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abtools"
version = "0.1.0"
description = "Tools for managing audiobooks on portable devices"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
abswap = "abtools.abswap:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
